{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
    <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">Log in</h1>
        <p>Enter your account details to continue.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log in</button>
        </form>
        <p><a href="{% url 'password_reset' %}">Set or reset your password</a></p>
        <p>New donor? <a href="{% url 'register' %}">Create an account</a>.</p>
    </section>
{% endblock %}

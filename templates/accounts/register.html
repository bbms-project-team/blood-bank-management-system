{% extends "base.html" %}

{% block title %}Create account{% endblock %}

{% block content %}
    <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">Create your donor account</h1>
        <p>Register to keep your donor profile up to date.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>
        <p>Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
    </section>
{% endblock %}

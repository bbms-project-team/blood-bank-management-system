{% extends "base.html" %}

{% block title %}Submit blood request{% endblock %}

{% block content %}
    <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">Submit blood request</h1>
        <p>Provide the patient and hospital details so staff can review the request.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit request</button>
        </form>
    </section>
{% endblock %}

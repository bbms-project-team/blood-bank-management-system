{% extends "base.html" %}

{% block title %}My donor profile{% endblock %}

{% block content %}
    <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">My donor profile</h1>
        <p>Keep your contact details and donation history current.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save profile</button>
        </form>
    </section>
{% endblock %}

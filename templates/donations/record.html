{% extends "base.html" %}

{% block title %}Record donation{% endblock %}

{% block content %}
    <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">Record accepted donation</h1>
        <p>Recorded donations are added to the blood inventory.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Record donation</button>
        </form>
    </section>
{% endblock %}
